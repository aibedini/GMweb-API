name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Tests mock the browser; skip Playwright's browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build dashboards and web app
        run: |
          npm --prefix dashboard-next ci
          npm --prefix dashboard-next run build
          npm --prefix web ci
          npm --prefix web run build
          if ! git diff --quiet -- public/dashboard-next public/web-app; then
            echo "Committed frontend assets are out of date"
            exit 1
          fi
      - name: Verify OpenAPI contract is in sync
        run: |
          npm run generate:openapi
          if ! git diff --quiet -- docs/openapi.json; then
            echo "docs/openapi.json is out of date with src/server.js"
            echo "Run: npm run generate:openapi  and commit the result"
            git diff --stat -- docs/openapi.json
            exit 1
          fi

  pairing-contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout Android Messages (canonical pairing protocol peer)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aibedini/Messages
          ref: master
          path: android-messages
      - name: Pairing protocol fixture must be byte-identical across repositories
        run: |
          cmp shared/pairing-protocol-v1.json android-messages/protocol/pairing-protocol-v1.json
          echo "GMweb shared/pairing-protocol-v1.json == Messages protocol/pairing-protocol-v1.json"
      - name: Android grants must equal the schema (fail on capability drift)
        run: |
          node -e '
            const schema = require("./shared/pairing-protocol-v1.json");
            const fs = require("node:fs");
            const kt = fs.readFileSync("android-messages/app/src/main/java/com/autonomousone/messages/security/PairingCapabilityContract.kt", "utf8");
            for (const cap of [...schema.capability_definitions.base, ...schema.capability_definitions.sensitive]) {
              if (!kt.includes(`"${cap}"`)) {
                console.error(`capability ${cap} is missing from PairingCapabilityContract.kt`);
                process.exit(1);
              }
            }
            console.log("Android PairingCapabilityContract covers every schema capability");
          '

  eve-contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout Eve consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aibedini/eve
          ref: main
          path: eve-contract-peer
      - name: Verify Eve and GMweb send contract
        run: node scripts/check-eve-contract.js eve-contract-peer
